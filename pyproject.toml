[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daf-vit"
version = "0.1.0"
description = "Dynamic Adaptive Fine-tuning for Vision Transformers"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "timm",
    "pyyaml",
    "tqdm",
    "datasets>=5,<6",
    "huggingface_hub>=1",
    "numpy>=1.26,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
